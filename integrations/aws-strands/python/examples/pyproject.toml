[tool.poetry]
name = "aws-strands-server"
version = "0.1.0"
description = "Strands integration server for AG-UI with multi-provider support"
authors = ["AG-UI Contributors"]
readme = "README.md"
packages = [{ include = "server" }]

[tool.poetry.dependencies]
python = "<3.15,>=3.10"
ag-ui-a2ui-toolkit = ">=0.0.4"
fastapi = "^0.115.12"
pydantic = ">=2.11.2"
python-dotenv = "^1.0.0"
uvicorn = ">=0.34.3"
strands-agents = {extras = ["openai", "anthropic", "gemini"], version = "^1.55.0"}
# strands-agents 1.63.0 allows openai 3.x, whose typed response annotations
# break OpenAIResponsesModel's url_citation handling (it calls .get() on them).
# Hold openai below 3 until strands supports it.
openai = "<3.0.0"
ag_ui_strands = {path = "..", develop = true}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dev = "server:main"
