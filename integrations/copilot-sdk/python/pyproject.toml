[project]
name = "ag-ui-copilot-sdk"
version = "0.1.0"
description = "Native GitHub Copilot SDK adapter for AG-UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "github-copilot-sdk==1.0.34",
]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn[standard]>=0.23,<1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28", "fastapi>=0.100", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ag_ui_copilot_sdk"]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
