spring.application.name=spring-ai-dojo-server
server.port=${PORT:8027}

# OpenAI-compatible model. run-dojo-everything.js sets OPENAI_BASE_URL (aimock,
# http://localhost:5555/v1) and OPENAI_API_KEY for e2e runs.
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL_ID:gpt-4o}
