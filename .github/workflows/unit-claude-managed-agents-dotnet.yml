# Every unit-*.yml in this repository is called "unit", so this workflow must not
# key its concurrency group off github.workflow: doing so would put it in the
# same group as unit-dotnet-sdk.yml on the same ref, and each push would cancel
# the other's in-flight run. Both the display name and the group are unique.
name: unit / claude-managed-agents (.NET)

on:
  push:
    branches: [main]
    # GitHub Actions does not support YAML anchors, so the two filters repeat.
    paths:
      - "integrations/claude-managed-agents/dotnet/**"
      - "sdks/dotnet/src/**"
      # The library builds against the .NET SDK by project reference, so the
      # files that govern that build have to trigger it too.
      - "sdks/dotnet/Directory.Build.props"
      - "sdks/dotnet/Directory.Build.targets"
      - "sdks/dotnet/Directory.Packages.props"
      - "sdks/dotnet/global.json"
      - "sdks/dotnet/nuget.config"
      - ".github/workflows/unit-claude-managed-agents-dotnet.yml"
      # The pack-version check below runs the release's pack script.
      - ".github/workflows/publish-release.yml"
      - "scripts/release/pack-dotnet-packages.sh"
  pull_request:
    branches: [main]
    paths:
      - "integrations/claude-managed-agents/dotnet/**"
      - "sdks/dotnet/src/**"
      # The library builds against the .NET SDK by project reference, so the
      # files that govern that build have to trigger it too.
      - "sdks/dotnet/Directory.Build.props"
      - "sdks/dotnet/Directory.Build.targets"
      - "sdks/dotnet/Directory.Packages.props"
      - "sdks/dotnet/global.json"
      - "sdks/dotnet/nuget.config"
      - ".github/workflows/unit-claude-managed-agents-dotnet.yml"
      # The pack-version check below runs the release's pack script.
      - ".github/workflows/publish-release.yml"
      - "scripts/release/pack-dotnet-packages.sh"

permissions:
  contents: read

concurrency:
  group: unit-claude-managed-agents-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-managed-agents-dotnet:
    name: claude-managed-agents-dotnet
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/claude-managed-agents/dotnet
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          # global.json pins the 10.0 SDK; 8.0/9.0 runtimes are needed
          # because the library multi-targets net8.0/net9.0/net10.0.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build (library, example, tests)
        run: dotnet build -c Release

      - name: Run unit tests
        run: dotnet test tests/AGUI.ClaudeManagedAgents.Tests -c Release --no-build

      # The package is enrolled for release, so packing has to keep working: a
      # missing README, a bad PackageId or an unpackable target framework should
      # fail here rather than in the release pipeline.
      - name: Pack the NuGet package
        run: dotnet pack src/AGUI.ClaudeManagedAgents -c Release --no-build -o ./artifacts

      - name: Check the produced package files
        run: |
          set -euo pipefail
          ls -1 ./artifacts
          test -n "$(find ./artifacts -name 'AGUI.ClaudeManagedAgents.*.nupkg' -print -quit)"
          test -n "$(find ./artifacts -name 'AGUI.ClaudeManagedAgents.*.snupkg' -print -quit)"

      # Pack-only guard for the release's NuGet versions (PNI-572). It packs a
      # one-package list with scripts/release/pack-dotnet-packages.sh, the
      # script publish-release.yml packs with, in stable and prerelease mode,
      # into a local directory. Nothing is pushed and no secrets are used.
      # Rules:
      #   - the package version is VersionPrefix (stable) or
      #     VersionPrefix-<suffix> (prerelease);
      #   - every AGUI.* dependency (the ProjectReferenced SDK packages) is the
      #     SDK's own VersionPrefix in both modes, never the integration's suffix.
      - name: Check release pack versions (stable and prerelease)
        working-directory: .
        env:
          NAME: AGUI.ClaudeManagedAgents
          PKG_PATH: integrations/claude-managed-agents/dotnet/src/AGUI.ClaudeManagedAgents
          PROPS: integrations/claude-managed-agents/dotnet/Directory.Build.props
          SDK_PROPS: sdks/dotnet/Directory.Build.props
          SUFFIX: ci.packcheck.1
        run: |
          set -euo pipefail
          read_prefix() {
            sed -nE 's/.*<VersionPrefix[^>]*>([^<]+)<\/VersionPrefix>.*/\1/p' "$1" | head -n1
          }
          BASE_VERSION=$(read_prefix "$PROPS")
          SDK_VERSION=$(read_prefix "$SDK_PROPS")
          if [ -z "$BASE_VERSION" ] || [ -z "$SDK_VERSION" ]; then
            echo "::error::Could not read VersionPrefix from ${PROPS} or ${SDK_PROPS}"
            exit 1
          fi
          OUT="${RUNNER_TEMP}/pack-check"
          rm -rf "$OUT"

          # Same build command as publish-release.yml's "Build .NET packages".
          dotnet build "${PKG_PATH}/${NAME}.csproj" -c Release --no-incremental

          check() {
            local mode=$1 expected=$2
            local dir="${OUT}/${mode}"
            local list="${OUT}/${mode}-packages.json"
            mkdir -p "$OUT"
            jq -n --arg name "$NAME" --arg version "$expected" --arg path "$PKG_PATH" --arg file "$PROPS" \
              '[{name: $name, version: $version, path: $path, file: $file}]' > "$list"
            # The release's own pack script; it also fails when the nupkg name
            # does not carry the expected version.
            bash scripts/release/pack-dotnet-packages.sh "$mode" "$list" "$dir"
            local nuspec
            nuspec=$(unzip -p "${dir}/${NAME}.${expected}.nupkg" "${NAME}.nuspec")
            echo "--- ${mode} nuspec version and AGUI dependencies"
            grep -E '<version>|<dependency id="AGUI\.' <<<"$nuspec"
            local deps
            deps=$(grep -oE '<dependency id="AGUI\.[^"]+" version="[^"]+"' <<<"$nuspec" || true)
            for id in AGUI.Abstractions AGUI.Formatting; do
              if ! grep -q "id=\"${id}\"" <<<"$deps"; then
                echo "::error::${mode}: no ${id} dependency in the nuspec"
                return 1
              fi
            done
            local bad
            bad=$(grep -v "version=\"${SDK_VERSION}\"" <<<"$deps" || true)
            if [ -n "$bad" ]; then
              echo "::error::${mode}: SDK dependencies must be ${SDK_VERSION} (the SDK's VersionPrefix):"
              echo "$bad"
              return 1
            fi
          }

          check stable "$BASE_VERSION"
          check prerelease "${BASE_VERSION}-${SUFFIX}"
