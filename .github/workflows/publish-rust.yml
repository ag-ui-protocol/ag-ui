name: Publish Rust SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ag-ui version to publish (must match Cargo.toml)"
        required: true
        type: string
      dry_run:
        description: "Verify and package without uploading"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-rust-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: sdks/community/rust

jobs:
  verify:
    name: Verify Rust package
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sdks/community/rust
      - name: Check requested version and publish target
        id: version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != 'true' ]] && [[ "$GITHUB_REPOSITORY" != 'ag-ui-protocol/ag-ui' || "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Publishing is only supported from ag-ui-protocol/ag-ui main.' >&2
            exit 1
          fi
          declared=$(cargo metadata --locked --format-version 1 --no-deps |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "ag-ui"))')
          if [[ "$EXPECTED_VERSION" != "$declared" ]]; then
            echo "Requested version $EXPECTED_VERSION does not match manifest version $declared." >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Lint SDK and test harness
        run: cargo clippy --locked -p ag-ui -p ag-ui-xtask -p ag-ui-migration-tests --all-features --all-targets -- -D warnings
      - name: Test SDK and existing packages
        run: cargo test --locked --workspace --all-features
      - name: Check local AG-UI 1.0 schema
        run: cargo run --locked -p ag-ui-xtask -- drift-check --local
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Check TypeScript interoperability
        run: |
          npm ci --ignore-scripts --prefix interop
          npm test --prefix interop
          npm ci --ignore-scripts --prefix e2e/interop
          npm test --prefix e2e/interop
      - name: Install audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit dependencies
        run: cargo audit --deny warnings
      - name: Package and verify without uploading
        run: cargo package --locked -p ag-ui

  publish:
    name: Publish ag-ui to crates.io
    needs: verify
    if: ${{ !inputs.dry_run && github.repository == 'ag-ui-protocol/ag-ui' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: rust-crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      # The verify job already compiled the package from this exact commit.
      - name: Publish the verified SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify -p ag-ui
