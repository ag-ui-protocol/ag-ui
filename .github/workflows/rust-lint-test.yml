name: test

on:
  workflow_dispatch:
  push:
    # Validate fork branches before opening a pull request.
    paths:
      - "sdks/community/rust/**"
      - "sdks/typescript/packages/core/src/**"
      - "docs/sdk/rust/**"
      - ".github/workflows/rust-lint-test.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "sdks/community/rust/**"
      - "sdks/typescript/packages/core/src/**"
      - "docs/sdk/rust/**"
      - ".github/workflows/rust-lint-test.yml"

defaults:
  run:
    working-directory: ./sdks/community/rust

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    name: Rust SDK Tests [${{ matrix.os }}]
    runs-on: ${{ matrix.os }}

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Built-in cache is fork-safe (fork PRs can't write to base repo cache)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Build
        run: cargo build --locked --workspace --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy
        run: cargo clippy --locked -- -D warnings

      - name: Publish ag-ui-core dry-run
        run: cargo publish -p ag-ui-core --dry-run

      - name: Publish ag-ui-client dry-run
        # Keep the existing packaging-only check: publish verification cannot use
        # the workspace patch and resolves the older registry ag-ui-core instead.
        run: cargo publish -p ag-ui-client --dry-run --no-verify

      - name: Run tests
        run: cargo test --locked --workspace --all-features

  candidate:
    name: Unified Rust SDK validation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sdks/community/rust
      - name: Compare with this checkout's TypeScript protocol
        run: cargo run --locked -p ag-ui-xtask -- drift-check --local
      - name: Lint candidate and migration harness
        run: cargo clippy --locked -p ag-ui -p ag-ui-xtask -p ag-ui-migration-tests --all-features --all-targets -- -D warnings
      - name: Feature boundaries
        shell: bash
        run: |
          set -euo pipefail
          for features in '' sse verify protobuf schemars utoipa server server,verify,sse client http axum; do
            cargo check --locked -p ag-ui --all-targets --no-default-features --features "$features"
          done
          for features in sse,protobuf,schemars,utoipa server,verify,sse client,sse; do
            tree=$(cargo tree --locked -p ag-ui -e normal --prefix none --no-default-features --features "$features")
            if printf '%s\n' "$tree" | grep -E '^tokio v'; then
              echo "Unexpected tokio dependency for feature set: $features"
              exit 1
            fi
          done
      - name: Documentation
        run: cargo doc --locked -p ag-ui --all-features --no-deps
      - name: Package without publishing
        run: cargo package --locked -p ag-ui
      - name: Local server/client example
        run: cargo run --locked -p ag-ui-migration-tests --example local_round_trip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install isolated interop harness
        run: npm ci --ignore-scripts --prefix interop
      - name: TypeScript and Rust wire compatibility
        run: npm test --prefix interop
      - name: Install pinned official-schema suite
        run: npm ci --ignore-scripts --prefix e2e/interop
      - name: Official TypeScript schema semantics
        run: npm test --prefix e2e/interop

  audit:
    name: Rust dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sdks/community/rust
      - name: Install audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Check advisories and yanked dependencies
        run: cargo audit --deny warnings

  portability:
    name: Rust 1.85 and wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sdks/community/rust
      - name: Install supported Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - name: Minimum Rust version
        run: cargo +1.85.0 check --locked -p ag-ui --all-features --all-targets
      - name: Executor-independent wasm features
        shell: bash
        run: |
          set -euo pipefail
          for features in '' sse,protobuf,schemars,utoipa server,verify,sse client,sse; do
            cargo +1.85.0 check --locked -p ag-ui --target wasm32-unknown-unknown --no-default-features --features "$features"
          done
