name: unit-java-spring

on:
  push:
    branches: [main]
    paths:
      - "sdks/community/java/spring/**"
      - ".github/workflows/unit-java-spring.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/community/java/spring/**"
      - ".github/workflows/unit-java-spring.yml"

concurrency:
  group: unit-java-spring-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-spring:
    name: Java Spring integration unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # JDK 17 matches the Spring reactor's maven.compiler.release (the modules
      # pin to Java 17). The ag-ui core/client/server dependencies resolve from
      # Maven Central, so this build is independent of the ag-ui reactor and
      # fork-safe (fork PRs can't write to the base repo cache).
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        working-directory: sdks/community/java/spring
        run: mvn -B verify

      # `mvn verify` already fails on a failing test, but it passes happily when
      # surefire runs zero tests. Mirrors the ag-ui SDK's guard.
      - name: Parse test results
        if: always()
        working-directory: sdks/community/java/spring
        run: |
          echo "## Java Spring Test Results Summary"
          echo ""

          total_tests=0
          total_failures=0
          total_errors=0

          while IFS= read -r xml; do
            module_tests=$(grep -o 'tests="[0-9]*"' "$xml" | head -1 | sed 's/[^0-9]//g')
            module_failures=$(grep -o 'failures="[0-9]*"' "$xml" | head -1 | sed 's/[^0-9]//g')
            module_errors=$(grep -o 'errors="[0-9]*"' "$xml" | head -1 | sed 's/[^0-9]//g')
            total_tests=$((total_tests + ${module_tests:-0}))
            total_failures=$((total_failures + ${module_failures:-0}))
            total_errors=$((total_errors + ${module_errors:-0}))
          done < <(find . -path '*/target/surefire-reports/TEST-*.xml')

          echo "---"
          echo "### Overall Results: $total_tests tests, $total_failures failures, $total_errors errors"

          if [ "$total_failures" -gt 0 ] || [ "$total_errors" -gt 0 ]; then
            echo "❌ Some tests failed"
            exit 1
          elif [ "$total_tests" -eq 0 ]; then
            echo "⚠️ No tests were found or executed"
            exit 1
          else
            echo "✅ All $total_tests tests passed!"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: java-spring-surefire-reports
          path: sdks/community/java/spring/**/target/surefire-reports/
          retention-days: 7
