name: canary / publish

# Discoverable, one-click canary publisher. Surfaces in the Actions tab so any
# maintainer can publish a prerelease of the branch they're working on without
# learning the manual `canary/*` branch + dispatch dance.
#
# IMPORTANT: this workflow does NOT publish to npm itself. It ORCHESTRATES
# publish-release.yml, which holds the SINGLE npm OIDC trusted-publisher binding
# (see that file's header). Adding a second npm-publishing entry point would
# break OIDC for every @ag-ui/* package.
#
# Why a separate orchestrator instead of a flag inside publish-release.yml:
#   The `npm` GitHub Environment's deployment-branch policy is evaluated against
#   the ref a run is TRIGGERED on — NOT against branches created mid-run. So
#   publish-release.yml can only publish a canary when its run's ref already
#   matches the policy (`canary/*`). Creating a branch inside a run triggered on
#   `feature/*` does not change that run's ref, so it would still be rejected.
#   This workflow therefore runs on any non-main branch, mirrors it to a
#   short-lived `canary/<slug>` ref, dispatches publish-release.yml ON that ref
#   (clearing the env gate), waits for it, then deletes the ref.
#
# Tokens: the branch create and the cross-workflow dispatch use a devops-bot
# GitHub App token, NOT the default GITHUB_TOKEN. Events authenticated with
# GITHUB_TOKEN do not start new workflow runs (recursion prevention), so the
# delegated publish-release run would silently never fire. The branch delete
# uses a second devops-bot App token, minted just before cleanup (see Waiting).
#
# Waiting: the publish run can wait for a deployment approval. The "Wait for the
# publish run" step's WAIT_SECONDS (160 minutes) is that approval window. A run
# still not finished at the end of the window is cancelled and the canary
# fails: every non-main prerelease shares one concurrency group in
# publish-release.yml, so a pending run would block every later canary for as
# long as an approval can wait (30 days). Re-run the canary and approve within
# the window. The step's and the job's timeout-minutes sit above the window to
# leave room for the cancel, setup and cleanup. App tokens expire after one
# hour, so the wait reads and cancels the run with this job's own GITHUB_TOKEN
# (actions: write), which lasts for the whole job, and the cleanup mints a
# fresh app token instead of reusing the first one.
#
# Leftover canary refs: the cleanup never deletes the ref while the publish run
# can still use it. If that run is still not finished (for example, the cancel
# at the end of the window failed), or the cleanup cannot read its status, mint
# its token or delete the ref, the ref stays and the job prints the exact
# command to delete it. Run that command once the publish run has finished:
#   gh api -X DELETE repos/<owner>/<repo>/git/refs/heads/canary/<slug>-<run>-<attempt>
# To find leftovers: gh api repos/<owner>/<repo>/git/matching-refs/heads/canary/
# A re-run is a new attempt, so it creates and cleans up its own ref
# (...-<run>-<attempt+1>). It never touches a ref an earlier attempt left
# behind; delete those with the command above. If the ref is already gone,
# the cleanup step only logs that.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Package scope to publish a canary for. Regenerated from scripts/release/release.config.json — do NOT hand-edit (the release-scope-dropdown-sync CI guard enforces parity)."
        required: true
        type: choice
        options:
          - integration-a2a
          - integration-adk-js
          - integration-adk-py
          - integration-adk-ts
          - integration-ag2
          - integration-agent-spec
          - integration-agno
          - integration-antigravity-py
          - integration-antigravity-ts
          - integration-aws-strands-py
          - integration-aws-strands-ts
          - integration-claude-agent-sdk-py
          - integration-claude-agent-sdk-ts
          - integration-claude-managed-agents-dotnet
          - integration-claude-managed-agents-py
          - integration-claude-managed-agents-ts
          - integration-cloudflare-agents
          - integration-crewai-py
          - integration-crewai-ts
          - integration-langchain
          - integration-langgraph-py
          - integration-langgraph-ts
          - integration-langroid
          - integration-llama-index
          - integration-mastra
          - integration-omnara
          - integration-pydantic-ai
          - integration-spring-ai
          - integration-spring-ai-java
          - integration-spring-boot-java
          - integration-watsonx-py
          - integration-watsonx-ts
          - middleware-a2a
          - middleware-a2ui
          - middleware-mcp
          - middleware-mcp-apps
          - sdk-py
          - sdk-py-a2ui-toolkit
          - sdk-dotnet
          - sdk-java
          - sdk-kotlin
          - sdk-ts
          - sdk-ts-a2ui-toolkit
          - create-ag-ui-app
      suffix:
        description: "Prerelease suffix (e.g. 'fix-user-issue'); blank = publish-release uses a unix timestamp plus its own run id and attempt. Allowed: [a-zA-Z0-9._-]+. Reuse a suffix only if the base version moved, else the publish collides."
        required: false
        type: string
      dry_run:
        description: "Dry run: build + detect but do NOT publish to registries. Useful for previewing what would ship."
        required: false
        default: false
        type: boolean

concurrency:
  # One group per run, so runs never wait on or displace each other. GitHub
  # keeps at most one pending run per group and a newer run replaces it, so a
  # shared per-branch group would silently drop a queued canary (runs can last
  # 180 minutes). Each run owns a unique canary ref (slug + run id + attempt,
  # see the slug step below), so runs need no serialization here. publish-release.yml
  # serializes the delegated prerelease runs in one shared group (see its
  # concurrency block); the wait step cancels a run still pending at the end of
  # the approval window, so one unapproved canary cannot hold that group.
  group: canary-publish-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  # Workflow default: read-only. The canary job adds only actions: write (to read
  # the publish run, and to cancel it if it is still pending at the end of the
  # approval window). Every other write goes through the devops-bot App tokens
  # that the job mints — one for the create + dispatch, one for the cleanup delete.
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    # Must exceed the "Wait for the publish run" step's timeout-minutes (which
    # sits above its WAIT_SECONDS approval window) by enough for the setup steps
    # and the cleanup. Raise them together.
    timeout-minutes: 180
    permissions:
      contents: read
      # The job has no checkout and runs no repo code.
      actions: write  # read the publish run (wait + cleanup guard); cancel it if pending at the approval deadline
    steps:
      - name: Guard ref
        # Canary publishes are for non-main BRANCHES only. Block main (use the
        # stable release flow) and block non-branch refs such as tags (a tag
        # dispatch would otherwise canary-publish from the tagged commit).
        if: github.ref == 'refs/heads/main' || !startsWith(github.ref, 'refs/heads/')
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          echo "::error::Canary publishes are for non-main branches only (got '$RELEASE_REF'). To release from main, use the 'release / publish' workflow with mode=stable."
          exit 1

      - name: Validate suffix
        if: inputs.suffix != ''
        env:
          SUFFIX: ${{ inputs.suffix }}
        run: |
          set -euo pipefail
          # Validate BEFORE any side effect (token mint, ref creation) so a bad
          # suffix can't leave an orphaned canary ref behind. Bash regex matches
          # the WHOLE string (grep matches per line and would accept a multi-line
          # value whose first line is valid).
          if ! [[ "$SUFFIX" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid suffix '$SUFFIX'. Allowed: [a-zA-Z0-9._-]+ (blank = unix timestamp plus the publish run id and attempt)."
            exit 1
          fi

      - name: Mint devops-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: "Iv23liBNyieHVFKABrJ3"
          private-key: ${{ secrets.DEVOPS_BOT_PRIVATE_KEY }}
          # Scope the app token to only what this workflow uses, instead of
          # inheriting the app installation's blanket permissions (zizmor
          # github-app). contents:write creates the canary ref (the cleanup
          # step mints its own token to delete it); actions:write dispatches
          # publish-release.yml and locates its run.
          permission-contents: write
          permission-actions: write

      - name: Compute canary branch name
        id: slug
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Byte-deterministic (LC_ALL=C) transform collapsing the source ref to a
          # single path segment under canary/ so it matches the `canary/*`
          # deployment-branch policy. tr -s collapses same-char runs (so no `..`),
          # and the sed fully strips any leading/trailing `.`/`-` runs.
          export LC_ALL=C
          SLUG=$(printf '%s' "$REF_NAME" | tr '/' '-' | tr -c 'a-zA-Z0-9._-' '-' | tr -s '.-')
          SLUG=$(printf '%s' "$SLUG" | sed -E 's/^[.-]+//; s/[.-]+$//')
          if [ -z "$SLUG" ]; then
            echo "::error::Could not derive a canary slug from ref '$REF_NAME'"
            exit 1
          fi
          # Append run id AND attempt so every dispatch — including a re-run of
          # this same orchestration — owns a UNIQUE canary ref. This prevents two
          # dispatches whose source branches slugify to the same value (or a
          # re-run reusing the run id) from racing one shared ref, and keeps run
          # discovery below unambiguous (exactly one publish run per ref).
          REF_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=canary/${SLUG}-${REF_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "Canary branch: canary/${SLUG}-${REF_SUFFIX}"

      - name: Create or update canary ref
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.slug.outputs.branch }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Point canary/<slug>-<run>-<attempt> at the dispatched ref's HEAD. The
          # name includes the run id and attempt, so it should never pre-exist;
          # the force-update on "already exists" is defensive only. Any OTHER
          # failure (auth, rate limit, 5xx) must surface, not be silently retried.
          ERR=$(mktemp)
          if gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="$SHA" 2>"$ERR"; then
            echo "Created ${BRANCH} at ${SHA}"
          elif grep -qi "already exists" "$ERR"; then
            echo "Ref ${BRANCH} already exists; force-updating to ${SHA}"
            gh api --silent -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              -f sha="$SHA" -F force=true
          else
            echo "::error::Failed to create canary ref ${BRANCH}:"
            cat "$ERR" >&2
            exit 1
          fi

      - name: Dispatch publish-release.yml on the canary ref
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.slug.outputs.branch }}
          SCOPE: ${{ inputs.scope }}
          SUFFIX: ${{ inputs.suffix }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # (suffix already validated in the "Validate suffix" step above, before
          # the canary ref was created)
          gh workflow run publish-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH" \
            -f mode=prerelease \
            -f scope="$SCOPE" \
            -f suffix="$SUFFIX" \
            -f dry_run="$DRY_RUN"

          # The canary ref is unique to this run+attempt, so there is exactly ONE
          # publish-release dispatch on it — no timestamp watermark needed (which
          # also sidesteps runner/server clock-skew). Poll until it indexes
          # (30 x 6s = 3 min tolerance for Actions indexing lag). --limit is
          # defensive headroom; the branch/workflow/event filters are applied
          # server-side so the matching run is never crowded out.
          RUN_ID=""
          for _ in $(seq 1 30); do
            sleep 6
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow=publish-release.yml \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 100 \
              --json databaseId \
              --jq 'sort_by(.databaseId) | last | .databaseId // empty') || RUN_ID=""
            if [ -n "$RUN_ID" ]; then
              break
            fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Dispatched publish-release run never appeared on ${BRANCH}. Leaving the ref in place for debugging; delete it manually once resolved."
            exit 1
          fi

          # Mark located BEFORE the wait so cleanup runs even if the publish
          # fails — but is skipped entirely if we never tracked a run (so we
          # never delete a ref a still-pending run may need).
          echo "located=true" >> "$GITHUB_OUTPUT"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

          RUN_URL=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Delegated publish run: ${RUN_URL}"
          {
            echo "## Canary publish"
            echo ""
            echo "- **Scope:** \`${SCOPE}\`"
            echo "- **Source branch:** \`${GITHUB_REF_NAME}\`"
            echo "- **Delegated run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the publish run
        # The publish run can wait for a deployment approval. WAIT_SECONDS is
        # that approval window. A run still not finished when it ends is
        # cancelled (it would otherwise hold the shared prerelease group for up
        # to 30 days) and the step fails, so a canary ends either green with
        # its publish done or red. CANCEL_POLLS x CANCEL_POLL_SECONDS bounds
        # the wait for the cancel to take effect. timeout-minutes sits a little
        # above both, so the runner never kills the step first, and the job's
        # timeout-minutes stays above that. It reads and cancels with this
        # job's GITHUB_TOKEN, which does not expire mid-job (an app token would
        # after one hour). --interval 60 keeps the polling well under the
        # GITHUB_TOKEN rate limit.
        id: wait
        timeout-minutes: 165
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          WAIT_SECONDS: "9600"
          RETRY_BASE_SECONDS: "30"
          MAX_WATCH_ATTEMPTS: "5"
          CANCEL_POLLS: "12"
          CANCEL_POLL_SECONDS: "5"
        run: |
          # The runner runs this step with `bash -e`, so a failing command ends
          # the step unless it is tested. Each command that may fail on purpose
          # (the watch, the status read) is in an `if` or an `||`.
          set -uo pipefail
          DEADLINE=$((SECONDS + WAIT_SECONDS))
          ATTEMPT=0
          while :; do
            ATTEMPT=$((ATTEMPT + 1))
            LEFT=$((DEADLINE - SECONDS))
            WATCH_RC=124
            if [ "$LEFT" -gt 0 ]; then
              # --exit-status exits 0 only when the publish run succeeded. A
              # failed run and a GitHub API error both exit non-zero, so the
              # run's own status (read below) decides which one happened.
              WATCH_RC=0
              timeout "$LEFT" gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60 || WATCH_RC=$?
            fi
            if [ "$WATCH_RC" -eq 0 ]; then
              echo "Publish run ${RUN_ID} succeeded."
              exit 0
            fi
            STATUS=""
            CONCLUSION=""
            if VIEW=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + " " + (.conclusion // "")'); then
              read -r STATUS CONCLUSION <<<"$VIEW"
            fi
            CANCEL_CMD="gh run cancel ${RUN_ID} --repo ${GITHUB_REPOSITORY}"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Publish run ${RUN_ID} succeeded."
                exit 0
              fi
              if [ "$CONCLUSION" = "cancelled" ]; then
                echo "::error::Publish run ${RUN_ID} was cancelled before it finished. Most likely a newer prerelease displaced it from the shared release-publish-prerelease concurrency group (only one prerelease can wait there at a time), or someone cancelled it by hand. Re-run this canary."
                exit 1
              fi
              echo "::error::Publish run ${RUN_ID} failed (conclusion: ${CONCLUSION:-unknown}). See that run for the cause."
              exit 1
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              if [ -z "$STATUS" ]; then
                echo "::error::Stopped waiting after $((WAIT_SECONDS / 60)) minutes and could not read the status of publish run ${RUN_ID} (GitHub API error). Its outcome is unknown: check that run. If it is still pending, it holds the release-publish-prerelease concurrency group and blocks every later canary; cancel it with: ${CANCEL_CMD}"
                exit 1
              fi
              # The approval window is over. A pending publish run holds the
              # shared release-publish-prerelease group (an approval can wait
              # up to 30 days) and blocks every later canary, so cancel it and
              # fail. The Delete step then sees it completed and deletes the ref.
              WINDOW="$((WAIT_SECONDS / 60))-minute approval window"
              CANCEL_RC=0
              FINAL=""
              gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY" || CANCEL_RC=$?
              if [ "$CANCEL_RC" -eq 0 ]; then
                for _ in $(seq 1 "$CANCEL_POLLS"); do
                  FINAL=""
                  if VIEW=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + " " + (.conclusion // "")'); then
                    read -r FINAL _ <<<"$VIEW"
                  fi
                  if [ "$FINAL" = "completed" ]; then
                    break
                  fi
                  sleep "$CANCEL_POLL_SECONDS"
                done
              fi
              MSG="Publish run ${RUN_ID} was not approved within the ${WINDOW} (status: ${STATUS})."
              if [ "$FINAL" = "completed" ]; then
                MSG="${MSG} Cancelled run ${RUN_ID} so it stops holding the release-publish-prerelease concurrency group. Re-run this canary and approve the deployment within the window."
              else
                if [ "$CANCEL_RC" -ne 0 ]; then
                  MSG="${MSG} Cancelling it failed: the cancel request failed (exit ${CANCEL_RC})."
                else
                  MSG="${MSG} Cancelling it failed: the run had not stopped within $((CANCEL_POLLS * CANCEL_POLL_SECONDS)) s of the cancel (status: ${FINAL:-unreadable})."
                fi
                MSG="${MSG} Until it ends it holds the release-publish-prerelease concurrency group and blocks every later canary. Cancel it with: ${CANCEL_CMD}"
              fi
              echo "::error::${MSG}"
              echo "- **Publish:** ${MSG}" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ "$ATTEMPT" -ge "$MAX_WATCH_ATTEMPTS" ]; then
              echo "::error::Watching publish run ${RUN_ID} failed ${ATTEMPT} times on GitHub API errors (last watch exit ${WATCH_RC}, run status: ${STATUS:-unreadable}). This is a watch failure, NOT a publish failure: the publish run may still succeed, so check that run."
              exit 1
            fi
            DELAY=$((RETRY_BASE_SECONDS * (1 << (ATTEMPT - 1))))
            LEFT=$((DEADLINE - SECONDS))
            if [ "$DELAY" -gt "$LEFT" ]; then
              DELAY=$LEFT
            fi
            echo "::warning::Watching publish run ${RUN_ID} stopped early (exit ${WATCH_RC}, run status: ${STATUS:-unreadable}), likely a GitHub API error; retrying in ${DELAY}s (attempt ${ATTEMPT}/${MAX_WATCH_ATTEMPTS})."
            sleep "$DELAY"
          done

      - name: Mint devops-bot token for canary cleanup
        # Fresh token: the first one may be past its one-hour life by now.
        id: cleanup-token
        # Only the cleanup is left, so a mint failure must not fail the canary.
        # The Delete step reads this step's outcome and leaves the ref with a
        # warning.
        continue-on-error: true
        if: always() && steps.dispatch.outputs.located == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: "Iv23liBNyieHVFKABrJ3"
          # secrets-outside-env: the same repo-level key as the first mint in
          # this job. Phase 2 of the security remediation plan moves it into a
          # protected environment. That environment must allow canary's
          # non-main branches (Guard ref rejects main), so a main-only one
          # cannot serve this job.
          private-key: ${{ secrets.DEVOPS_BOT_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] see comment above
          # contents:write deletes the canary ref. Nothing else.
          permission-contents: write

      - name: Delete canary ref
        # Clean up only when we actually tracked a dispatched run (located=true),
        # even if that run then failed. If the run was never located, the ref is
        # deliberately left in place — deleting it could yank the ref out from
        # under a publish run that is still about to start.
        if: always() && steps.dispatch.outputs.located == 'true'
        env:
          GH_TOKEN: ${{ steps.cleanup-token.outputs.token }}
          MINT_OUTCOME: ${{ steps.cleanup-token.outcome }}
          STATUS_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.slug.outputs.branch }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          # Best-effort cleanup: never fail the job on a delete hiccup, but do
          # surface a real error instead of masking every failure as "gone".
          set -uo pipefail
          # Keep the ref, say why, and give the command to delete it later (see
          # "Leftover canary refs" in the header).
          leave() {
            local cmd="gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
            echo "::warning::$1 Leaving ${BRANCH} in place. Once publish run ${RUN_ID} has finished, delete it with: ${cmd}"
            echo "- **Canary ref left in place:** \`${BRANCH}\` ($1) Delete it once the publish run has finished: \`${cmd}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ "$MINT_OUTCOME" != "success" ] || [ -z "$GH_TOKEN" ]; then
            leave "The cleanup token could not be minted (outcome: ${MINT_OUTCOME:-unknown}), so the ref was not deleted."
          fi
          # Never delete the ref while the publish run can still run on it (for
          # example, still waiting for approval because the cancel at the end of
          # the approval window failed).
          ERR=$(mktemp)
          if ! STATUS=$(GH_TOKEN="$STATUS_TOKEN" gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq .status 2>"$ERR"); then
            leave "Could not read the status of publish run ${RUN_ID} (GitHub API error: $(head -c 300 "$ERR" | tr '\n' ' ')), so it may still be running."
          fi
          if [ "$STATUS" != "completed" ]; then
            leave "Publish run ${RUN_ID} is not finished (status: ${STATUS:-empty}); it may still be awaiting approval."
          fi
          if gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" 2>"$ERR"; then
            echo "Deleted ${BRANCH}"
          elif grep -qiE "not found|does not exist" "$ERR"; then
            echo "Branch ${BRANCH} already gone"
          else
            leave "Failed to delete canary ref ${BRANCH} (GitHub API error: $(head -c 300 "$ERR" | tr '\n' ' '))."
          fi
