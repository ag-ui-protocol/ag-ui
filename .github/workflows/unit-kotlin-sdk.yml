name: unit

on:
  push:
    branches: [main]
    paths:
      - "sdks/community/kotlin/**"
      - ".github/workflows/unit-kotlin-sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/community/kotlin/**"
      - ".github/workflows/unit-kotlin-sdk.yml"

permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"

      # Built-in cache is fork-safe (fork PRs can't write to base repo cache)
      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1  # v3.5.0

      - name: Run JVM and Wasm tests
        working-directory: sdks/community/kotlin/library
        run: ./gradlew jvmTest wasmJsBrowserTest --no-daemon --stacktrace

      - name: Parse test results
        if: always()
        working-directory: sdks/community/kotlin/library
        run: |
          bash ../scripts/summarize-test-results.sh \
            core/jvmTest client/jvmTest tools/jvmTest \
            core/wasmJsBrowserTest client/wasmJsBrowserTest tools/wasmJsBrowserTest

  kotlin-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"

      # Built-in cache is fork-safe (fork PRs can't write to base repo cache)
      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1  # v3.5.0

      # The client module also declares an Android target, so Gradle needs the SDK to configure it.
      - name: Install Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4

      - name: Install Android 36 components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Run macOS ARM64 tests
        working-directory: sdks/community/kotlin/library
        run: ./gradlew macosArm64Test --no-daemon --stacktrace

      - name: Parse test results
        if: always()
        working-directory: sdks/community/kotlin/library
        run: bash ../scripts/summarize-test-results.sh core/macosArm64Test client/macosArm64Test tools/macosArm64Test
