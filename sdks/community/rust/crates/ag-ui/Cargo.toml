[package]
name = "ag-ui"
description = "Rust SDK for AG-UI 1.0 with protocol types, JSON/SSE, client and server runtimes, and Axum integration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# These integration suites read the monorepo's frozen spec and run in workspace CI.
exclude = [
    "tests/client_conformance_1_0.rs",
    "tests/client_thread_1_0.rs",
    "tests/conformance_1_0.rs",
    "tests/fixtures_1_0.rs",
    "tests/fixtures/local",
    "tests/optional_null_input.rs",
    "tests/tool_content_1_0.rs",
    "tests/upstream_payloads.rs",
]

# Every runtime past the protocol types is a feature, so docs.rs must build them
# all or the rendered API is a fraction of the real one.
[package.metadata.docs.rs]
all-features = true
# Sets the `docsrs` cfg the crate reads to label feature-gated items.
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The protocol types and SSE framing, plus the server's ordering verifier for
# anyone who turns `server` on. `verify` is listed here rather than implied by
# `server` so that `default-features = false` can drop it — a feature cannot be
# subtracted from the set another feature pulls in.
default = ["sse", "verify"]

# ---- core: types and wire encoding, always compiled ----
# Server-Sent Events framing. No extra dependencies.
sse = []
# Binary transport: the media type and content negotiation only. There is no
# encoder: upstream's 1.0 events.proto covers all 31 1.0 event types, but the
# stock TypeScript client asks for text/event-stream. See `encode::protobuf`.
# Deliberately pulls in no dependency: it would be a `prost` build for a module
# that never calls it.
protobuf = []
# Opt-in schema derives (see ag-ui-protocol/ag-ui#1407).
schemars = ["dep:schemars"]
utoipa = ["dep:utoipa"]

# ---- serve: host an agent ----
server = [
    "dep:futures-core",
    "dep:futures-channel",
    "dep:futures-util",
    "dep:json-patch",
]
# Protocol ordering verification for `server`. On by default; cheap in release,
# and the whole verifier compiles away without it.
verify = []

# ---- client: consume an agent ----
# Transport-agnostic. Bring your own `Transport`, or turn on `http`.
client = ["dep:futures-core", "dep:futures-util", "dep:json-patch", "dep:getrandom", "dep:jiff", "dep:js-sys"]
# reqwest-backed HTTP transport. What most consumers want; leave it off for
# wasm or a custom transport. Implies `sse`, because the transport negotiates
# the SSE media type on every request.
http = ["client", "sse", "dep:reqwest", "dep:tokio"]

# ---- axum: mount a hosted agent on a router ----
axum = ["server", "sse", "dep:axum"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

schemars = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

futures-core = { workspace = true, optional = true }
futures-channel = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
json-patch = { workspace = true, optional = true }
jiff = { version = "1.0.1", default-features = false, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
futures-util = { workspace = true, features = ["std"] }
# `net`/`io-util` for the raw HTTP/1.1 client in tests/axum_http.rs, `time` for
# its timeouts, the rest for the server and client test suites.
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
] }
# `oneshot` in the axum doctest, so the example needs no port.
tower = { workspace = true, features = ["util"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
getrandom = { version = "0.2.16", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.2.16", features = ["js"], optional = true }
js-sys = { version = "0.3", optional = true }
