[package]
name = "ag-ui-encoder"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Framework-independent AG-UI 1.0 JSON/SSE producer encoder."
license = "MIT"
repository = "https://github.com/ag-ui-protocol/ag-ui"
homepage = "https://docs.ag-ui.com"
documentation = "https://docs.rs/ag-ui-encoder"
keywords = ["ag-ui", "agents", "ai", "protocol"]
categories = ["api-bindings"]
exclude = ["tests/**"]

[dependencies]
ag-ui-core = { path = "../ag-ui-core", version = "0.2.0" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
