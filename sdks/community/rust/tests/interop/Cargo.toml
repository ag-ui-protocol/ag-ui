[package]
name = "ag-ui-interop-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Test infrastructure only. A separate workspace prevents accidental publication.
[workspace]
resolver = "3"

[dependencies]
ag-ui-core = { path = "../../crates/ag-ui-core" }
ag-ui-client = { path = "../../crates/ag-ui-client" }
ag-ui-encoder = { path = "../../crates/ag-ui-encoder" }
async-trait = "0.1.88"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread"] }
