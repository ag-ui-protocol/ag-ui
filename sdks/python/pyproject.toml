[project]
name = "ag-ui-protocol"
version = "1.0.0"
description = ""
license-files = ["LICENSE"]
authors = [
    { name = "Markus Ecker", email = "markus.ecker@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["ag-ui", "agent", "protocol", "agui-protocol-1.0"]
dependencies = [
    "pydantic>=2.11.2",
]

[project.urls]
Changelog = "https://github.com/ag-ui-protocol/ag-ui/releases"

[tool.ag-ui]
# The protocol version this distribution implements, kept in step with the
# schema $id by the spec harness.
protocol-version = "1.0"

[tool.ag-ui.scripts]
test = "python -m unittest discover tests"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "ag_ui"
